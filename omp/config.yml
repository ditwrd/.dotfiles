providers:
  webSearchOrder:
    - public
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
modelRoles:
  advisor: anthropic/claude-opus-5:auto
  smol: opencode-go/deepseek-v4.1-flash:auto
  designer: anthropic/claude-opus-5:auto
  slow: opencode-go/deepseek-v4.1-flash:auto
  default: opencode-go/deepseek-v4.1-flash:auto
  tiny: opencode-go/deepseek-v4.1-flash:auto
  plan: anthropic/claude-fable-5:auto
defaultThinkingLevel: auto
statusLine:
  preset: nerd
tui:
  textSizing: true
display:
  showTokenUsage: true
  cacheMissMarker: true
advisor:
  enabled: true
  syncBacklog: "off"
  immuneTurns: 3
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
edit:
  mode: hashline
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
disabledExtensions: []
github:
  enabled: true
secrets:
  enabled: true
retry:
  fallbackChains:
    tiny:
      - zai/glm-5.3-flash
    smol:
      - zai/glm-5.3-flash
    slow:
      - zai/glm-5.3-flash
    default:
      - zai/glm-5.3-flash
    advisor:
      - opencode-go/deepseek-v4.1-flash
      - zai/glm-5.3-flash
astGrep:
  enabled: true
dev:
  autoqa: false
compaction:
  handoffSaveToDisk: false
  thresholdTokens: 150000
  enabled: true
  methodOrder:
    - snapcompact
    - handoff
    - soft
    - shake
    - remote
task:
  agentAdvisor:
    task: "on"
composer:
  shape: box
steeringMode: one-at-a-time
snapcompact:
  toolResults: false
hideThinkingBlock: false

k9s = "0.51.0"
kompose = "latest"
kubeconform = "latest"
kubectl = "1.31.5"
kubectx = "latest"
kubeseal = "0.36.6"
kustomize = "latest"
lazydocker = "latest"
lazygit = "0.65.0"
neovim = "0.12.5"

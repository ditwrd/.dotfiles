"npm:@kahme247/ompweb" = "0.5.0"
"npm:@postgres-language-server/cli" = "latest"
"npm:calldiff" = "latest"
"npm:cf" = "latest"
"npm:pake-cli" = "3.7.8"
# No global `python` pin on purpose. A pinned version lands first in PATH and
# takes over every Arch script shebanged `#!/usr/bin/env python3`
# (powerprofilesctl, g-ir-scanner, spd-conf, libwacom-*, KateDJ...), where
# pacman's PyGObject/gobject-introspection C extensions only exist for the
# system cpython. With no pin, mise shims fall through to /usr/bin/python3.
# Projects declare their own version in .python-version instead.
#
# powerprofilesctl is still called from inside 3.12-pinned projects (pg,
# pontoon, py-mojo, lab-mojo), so that interpreter carries its own bindings:
#   ~/.local/share/mise/installs/python/3.12/bin/python3 -m pip install --user PyGObject setuptools
# setuptools also restores distutils, which 3.12 dropped.
rtk = "0.51.0"
rust = "latest"
terraform = "1.12.1"
terragrunt = "0.81.0"
uv = "latest"
vault = "2.0.1"
worktrunk = "0.66.0"
yamllint = "latest"
zig = "0.15.2"
claude = "2.1.318"

# zerobrew ships bare binaries (zb-linux-x64, zb-darwin-arm64, plus zbx/zb-brew
# siblings), so format/bin are required and each asset is named per platform to
# keep autodetection from picking a sibling binary.
[tools."github:zerobrewhq/zerobrew"]
version = "0.4.2"
format = "raw"
bin = "zb"

[tools."github:zerobrewhq/zerobrew".platforms]
linux-x64 = { asset_pattern = "zb-linux-x64" }
linux-arm64 = { asset_pattern = "zb-linux-arm64" }
macos-arm64 = { asset_pattern = "zb-darwin-arm64" }
macos-x64 = { asset_pattern = "zb-darwin-x64" }

[settings]
experimental = true

[settings.npm]
bun = true
